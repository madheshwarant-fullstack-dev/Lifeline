services:
  - type: web
    name: lifeline-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: lifeline
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "86400"
      - key: FRONTEND_URL
        sync: false
